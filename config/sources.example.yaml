# Consumer config. One entry per customer stack (one per account + region).
# Copy to config/sources.yaml (git-ignored). ${VAR} values are read from the environment.
# Re-read every 30 s: add or remove customers without a restart.

sink:
  type: file                 # stdout | file | kafka
  path: ./out/events.jsonl
  # type: kafka
  # bootstrap_servers: broker1:9092,broker2:9092
  # topic: aws-logs
  # extra: { security.protocol: SSL }

sources:
  # From the shared template, this is all you need. The queue URL and role ARN are
  # derived from account + region, and log types are detected from each object's key.
  - tenant: acme
    account_id: "444455556666"
    region: us-east-1
    auth:
      external_id: ${EXTERNAL_ID_ACME}

  # Same customer, logs in their Control Tower log-archive account: second stack,
  # same tenant and ExternalId.
  - tenant: acme
    account_id: "777788889999"
    region: us-east-1
    auth:
      external_id: ${EXTERNAL_ID_ACME}

  # Optional overrides: pin parsers for specific buckets, and catch files outside
  # AWS's standard layout (e.g. Firehose output from AdditionalBuckets).
  - tenant: globex
    account_id: "111122223333"
    region: eu-west-1
    auth:
      external_id: ${EXTERNAL_ID_GLOBEX}
    default_parser: jsonl
    # buckets:                 # instead of auto-detection
    #   globex-firehose-logs: jsonl
