<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Event-driven ingestion: S3 log buckets in the source account notify an SQS queue; a consumer in the ingesting account assumes a reader role, drains the queue, fetches each object and writes parsed events to a sink."><rect width="1000" height="470" rx="10" fill="#FFFFFF"/><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7D8896"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A83"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect x="16" y="40" width="620" height="414" rx="10" fill="#F2F5F8" stroke="#7D8896" stroke-width="1"/><text x="34" y="30" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#5B6676">SOURCE AWS ACCOUNT · ONE STACK PER ACCOUNT + REGION</text><text x="34" y="64" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" fill="#5B6676">CloudFormation stack  log-ingest-&lt;tag&gt;</text><rect x="664" y="40" width="320" height="414" rx="10" fill="#F2F5F8" stroke="#7D8896" stroke-width="1"/><text x="682" y="30" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#5B6676">INGESTING SIDE · RUNS ANYWHERE</text><rect x="34" y="96" width="132" height="38" rx="6" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.4"/><text x="100.0" y="119.5" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">CloudTrail</text><polyline points="166,115 206,115" fill="none" stroke="#7D8896" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="34" y="154" width="132" height="38" rx="6" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.4"/><text x="100.0" y="177.5" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">VPC Flow Logs</text><polyline points="166,173 206,173" fill="none" stroke="#7D8896" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="34" y="212" width="132" height="38" rx="6" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.4"/><text x="100.0" y="235.5" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">ALB · WAF · Config</text><polyline points="166,231 206,231" fill="none" stroke="#7D8896" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="186" y="88" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6676">deliver</text><rect x="210" y="86" width="130" height="164" rx="6" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.4"/><text x="275.0" y="166.0" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">S3 log buckets</text><text x="275.0" y="181.0" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6676">BucketNames</text><polyline points="340,150 428,150" fill="none" stroke="#0B7A83" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="384" y="140" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0B7A83">ObjectCreated</text><text x="384" y="170" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6676">prefix filter</text><rect x="432" y="126" width="150" height="48" rx="6" fill="#FFFFFF" stroke="#0B7A83" stroke-width="1.4"/><text x="507.0" y="148.0" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">SQS queue</text><text x="507.0" y="163.0" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6676">long-poll · SSE</text><polyline points="507,174 507,226" fill="none" stroke="#B45309" stroke-width="1.6" marker-end="url(#a-warn)"/><text x="517" y="205" text-anchor="start" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#B45309">after 5 failed receives</text><rect x="432" y="230" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/><text x="507.0" y="250.0" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">Dead-letter queue</text><text x="507.0" y="265.0" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6676">14-day hold</text><rect x="210" y="338" width="150" height="48" rx="6" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.4" stroke-dasharray="5 4"/><text x="285.0" y="360.0" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">Bucket manager</text><text x="285.0" y="375.0" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6676">custom resource</text><polyline points="275,338 275,254" fill="none" stroke="#7D8896" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-ink)"/><text x="283" y="300" text-anchor="start" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6676">wires notifications</text><rect x="432" y="338" width="150" height="48" rx="6" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.4"/><text x="507.0" y="360.0" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">Reader role</text><text x="507.0" y="375.0" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6676">sts:ExternalId</text><polyline points="360,362 428,362" fill="none" stroke="#7D8896" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-ink)"/><text x="394" y="328" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6676">scopes GetObject</text><text x="34" y="420" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6676">Create / Update / Delete of the stack re-runs the manager:</text><text x="34" y="437" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6676">add a bucket = edit BucketNames, no new stack, key or queue.</text><rect x="700" y="126" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#0B7A83" stroke-width="1.4"/><text x="780.0" y="148.0" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">Consumer</text><text x="780.0" y="163.0" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6676">thread per source</text><polyline points="700,150 586,150" fill="none" stroke="#0B7A83" stroke-width="1.6" marker-end="url(#a-acc)"/><text x="643" y="140" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0B7A83">receive · delete</text><polyline points="780,126 780,76 275,76 275,84" fill="none" stroke="#0B7A83" stroke-width="1.6" marker-end="url(#a-acc)"/><text x="528" y="70" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0B7A83">GetObject (after assume-role)</text><polyline points="700,164 682,164 682,362 586,362" fill="none" stroke="#7D8896" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="620" y="404" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6676">AssumeRole + ExternalId</text><rect x="700" y="230" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.4"/><text x="780.0" y="250.0" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">Parsers</text><text x="780.0" y="265.0" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6676">one per log type</text><polyline points="820,174 820,226" fill="none" stroke="#0B7A83" stroke-width="1.6" marker-end="url(#a-acc)"/><text x="828" y="205" text-anchor="start" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0B7A83">object bytes</text><rect x="880" y="300" width="90" height="44" rx="6" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.4"/><text x="925.0" y="320.0" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430">Sink</text><text x="925.0" y="335.0" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6676">kafka · file</text><polyline points="860,252 925,252 925,296" fill="none" stroke="#0B7A83" stroke-width="1.6" marker-end="url(#a-acc)"/><text x="900" y="244" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0B7A83">events</text><text x="700" y="420" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6676">Message deleted only after the sink</text><text x="700" y="437" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6676">accepts every event (at-least-once).</text><line x1="700" y1="454" x2="700" y2="454" stroke="none"/></svg>
