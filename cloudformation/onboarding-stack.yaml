# GENERATED by tools/build_template.py from onboarding-stack.src.yaml + lambda/bucket_manager.py. Do not edit.
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Event-driven log ingestion onboarding. Wires the listed S3 log buckets to one SQS
  queue and grants a read-only reader access to exactly those buckets. Re-run as a
  stack UPDATE to add or remove buckets. Never create a second stack for the same source.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "1. What to ingest" }
        Parameters: [SourceTag, BucketNames, BucketPrefixes, KmsKeyArns]
      - Label: { default: "2. Who may read it" }
        Parameters: [AccessMode, TrustedPrincipalArn, ExternalId]
    ParameterLabels:
      SourceTag: { default: "Source tag (names every resource; never change later)" }
      BucketNames: { default: "Log bucket names (comma-separated)" }
      BucketPrefixes: { default: "Key prefix per bucket (NONE = whole bucket)" }
      KmsKeyArns: { default: "KMS key ARNs the logs are encrypted with (NONE if SSE-S3)" }
      AccessMode: { default: "Access mode" }
      TrustedPrincipalArn: { default: "Ingesting account principal ARN (role mode)" }
      ExternalId: { default: "External ID (role mode)" }

Parameters:
  SourceTag:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$"
    ConstraintDescription: "3-30 chars: lowercase letters, digits, dashes (e.g. acme-prod)"
    Description: Short slug used in every resource name, e.g. acme-prod.
  BucketNames:
    Type: CommaDelimitedList
    Default: ""
    Description: Every bucket to ingest. All must be in this stack's region.
  BucketPrefixes:
    Type: CommaDelimitedList
    Default: "NONE"
    Description: >-
      NONE for no filtering, or one entry per bucket in the same order
      (write NONE for any bucket that needs no filter), e.g. AWSLogs/,NONE
  KmsKeyArns:
    Type: CommaDelimitedList
    Default: "NONE"
    Description: KMS keys protecting the log objects. The key policy must also allow the reader.
  AccessMode:
    Type: String
    Default: CrossAccountRole
    AllowedValues: [CrossAccountRole, AccessKey]
    Description: >-
      CrossAccountRole (recommended, no long-lived secrets) or AccessKey
      (an IAM user whose key is stored in Secrets Manager).
  TrustedPrincipalArn:
    Type: String
    Default: ""
    Description: e.g. arn:aws:iam::111122223333:role/log-ingest-consumer. Required for CrossAccountRole.
  ExternalId:
    Type: String
    Default: ""
    Description: Shared secret the consumer must present when assuming the role. Required for CrossAccountRole.

Rules:
  RoleModeNeedsTrust:
    RuleCondition: !Equals [!Ref AccessMode, CrossAccountRole]
    Assertions:
      - Assert: !Not [!Equals [!Ref TrustedPrincipalArn, ""]]
        AssertDescription: TrustedPrincipalArn is required when AccessMode is CrossAccountRole
      - Assert: !Not [!Equals [!Ref ExternalId, ""]]
        AssertDescription: ExternalId is required when AccessMode is CrossAccountRole

Conditions:
  UseRole: !Equals [!Ref AccessMode, CrossAccountRole]
  UseKey: !Equals [!Ref AccessMode, AccessKey]

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "log-ingest-${SourceTag}-dlq"
      MessageRetentionPeriod: 1209600        # 14 days to notice and redrive
      SqsManagedSseEnabled: true

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "log-ingest-${SourceTag}"
      VisibilityTimeout: 300                 # > worst-case time to fetch + parse one object
      MessageRetentionPeriod: 345600         # 4 days of buffer if the consumer is down
      ReceiveMessageWaitTimeSeconds: 20      # long polling: fewer, cheaper API calls
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  IngestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IngestQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3FromThisAccountOnly
            Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              ArnLike: { "aws:SourceArn": "arn:aws:s3:::*" }
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ---------------------------------------------------------------- reader identity
  ReaderRole:
    Type: AWS::IAM::Role
    Condition: UseRole
    Properties:
      RoleName: !Sub "log-ingest-${SourceTag}-reader"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref TrustedPrincipalArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "sts:ExternalId": !Ref ExternalId }
      Policies:
        - PolicyName: consume-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: !GetAtt IngestQueue.Arn

  ReaderUser:
    Type: AWS::IAM::User
    Condition: UseKey
    Properties:
      UserName: !Sub "log-ingest-${SourceTag}-reader"
      Policies:
        - PolicyName: consume-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: !GetAtt IngestQueue.Arn

  ReaderAccessKey:
    Type: AWS::IAM::AccessKey
    Condition: UseKey
    Properties:
      UserName: !Ref ReaderUser

  ReaderAccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseKey
    Properties:
      Name: !Sub "log-ingest/${SourceTag}/reader-access-key"
      Description: Access key for the log-ingest reader. Share through a secure channel only.
      SecretString: !Sub '{"AccessKeyId":"${ReaderAccessKey}","SecretAccessKey":"${ReaderAccessKey.SecretAccessKey}"}'

  # ---------------------------------------------------------------- bucket manager
  ManagerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: manage-bucket-wiring
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EditBucketNotifications   # bucket list is dynamic, so this can't be narrowed statically
                Effect: Allow
                Action: [s3:GetBucketNotification, s3:PutBucketNotification]
                Resource: "arn:aws:s3:::*"
              - Sid: EditReaderInlinePolicyOnly
                Effect: Allow
                Action: !If
                  - UseRole
                  - [iam:PutRolePolicy, iam:DeleteRolePolicy]
                  - [iam:PutUserPolicy, iam:DeleteUserPolicy]
                Resource: !If [UseRole, !GetAtt ReaderRole.Arn, !GetAtt ReaderUser.Arn]

  ManagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Reconciles S3 notifications and reader permissions with BucketNames
      Runtime: python3.13
      Handler: index.handler
      Timeout: 120
      MemorySize: 128
      Role: !GetAtt ManagerRole.Arn
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3
          from botocore.exceptions import ClientError
          s3 = boto3.client('s3')
          iam = boto3.client('iam')
          POLICY_NAME = 'read-listed-buckets'

          def _clean(values):
           return [v.strip() for v in values or [] if v and v.strip()]

          def desired(props, strict=True):
           names = _clean(props.get('BucketNames'))
           prefixes = _clean(props.get('BucketPrefixes')) or ['NONE']
           if prefixes == ['NONE']:
            prefixes = ['NONE'] * len(names)
           if strict:
            if not names:
             raise ValueError('BucketNames must list at least one bucket')
            if len(prefixes) != len(names):
             raise ValueError(f'BucketPrefixes has {len(prefixes)} entries, BucketNames has {len(names)}: use NONE alone or one entry per bucket')
            if len(set(names)) != len(names):
             raise ValueError('BucketNames contains duplicates')
           return {n: None if p.upper() == 'NONE' else p for n, p in zip(names, prefixes)}

          def set_notification(bucket, config_id, queue_arn=None, prefix=None):
           cfg = s3.get_bucket_notification_configuration(Bucket=bucket)
           cfg.pop('ResponseMetadata', None)
           queues = [q for q in cfg.get('QueueConfigurations', []) if q.get('Id') != config_id]
           if queue_arn:
            entry = {'Id': config_id, 'QueueArn': queue_arn, 'Events': ['s3:ObjectCreated:*']}
            if prefix:
             entry['Filter'] = {'Key': {'FilterRules': [{'Name': 'prefix', 'Value': prefix}]}}
            queues.append(entry)
           cfg['QueueConfigurations'] = queues
           s3.put_bucket_notification_configuration(Bucket=bucket, NotificationConfiguration=cfg)

          def reader_policy(buckets, kms_keys):
           statements = [{'Effect': 'Allow', 'Action': 's3:GetObject', 'Resource': ['arn:aws:s3:::%s/%s*' % (b, p or '') for b, p in sorted(buckets.items())]}]
           if kms_keys:
            statements.append({'Effect': 'Allow', 'Action': 'kms:Decrypt', 'Resource': kms_keys})
           return json.dumps({'Version': '2012-10-17', 'Statement': statements})

          def apply_policy(props, buckets):
           kms = [k for k in _clean(props.get('KmsKeyArns')) if k.upper() != 'NONE']
           for kind, name in (('role', props.get('ReaderRoleName')), ('user', props.get('ReaderUserName'))):
            if not name:
             continue
            key = {'role': 'RoleName', 'user': 'UserName'}[kind]
            args = {key: name, 'PolicyName': POLICY_NAME}
            if buckets:
             getattr(iam, f'put_{kind}_policy')(PolicyDocument=reader_policy(buckets, kms), **args)
            else:
             try:
              getattr(iam, f'delete_{kind}_policy')(**args)
             except ClientError as e:
              print(f'policy cleanup skipped: {e}')

          def reconcile(event):
           kind = event['RequestType']
           props = event['ResourceProperties']
           config_id = props['ConfigId']
           if kind == 'Delete':
            want, had = ({}, desired(props, strict=False))
           elif kind == 'Update':
            want, had = (desired(props), desired(event.get('OldResourceProperties', {}), strict=False))
           else:
            want, had = (desired(props), {})
           for bucket in sorted(set(had) - set(want)):
            try:
             set_notification(bucket, config_id)
             print('unwired', bucket)
            except ClientError as e:
             print(f'could not clean {bucket}: {e}')
           for bucket, prefix in sorted(want.items()):
            set_notification(bucket, config_id, props['QueueArn'], prefix)
            print('wired', bucket, prefix or '')
           apply_policy(props, want)
           return {'Buckets': ','.join(sorted(want)), 'Count': str(len(want))}

          def send(event, context, status, data=None, reason=''):
           log = getattr(context, 'log_stream_name', '-')
           body = {k: event[k] for k in ('StackId', 'RequestId', 'LogicalResourceId')}
           body.update(Status=status, Reason=reason[:900] or 'log: ' + log, Data=data or {}, PhysicalResourceId=event.get('PhysicalResourceId') or event['LogicalResourceId'] + '-wiring')
           req = urllib.request.Request(event['ResponseURL'], data=json.dumps(body).encode(), method='PUT', headers={'Content-Type': ''})
           urllib.request.urlopen(req, timeout=15)

          def handler(event, context):
           print(event['RequestType'], json.dumps(event['ResourceProperties']))
           try:
            send(event, context, 'SUCCESS', reconcile(event))
           except Exception as e:
            print(f'ERROR: {e}')
            status = 'SUCCESS' if event['RequestType'] == 'Delete' else 'FAILED'
            send(event, context, status, reason=str(e))

  ManagerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ManagerFunction}"
      RetentionInDays: 30

  BucketWiring:
    Type: Custom::BucketWiring
    DependsOn: [IngestQueuePolicy, ManagerLogGroup]   # S3 checks the queue policy when wiring
    Properties:
      ServiceToken: !GetAtt ManagerFunction.Arn
      ConfigId: !Sub "log-ingest-${SourceTag}"
      QueueArn: !GetAtt IngestQueue.Arn
      BucketNames: !Ref BucketNames
      BucketPrefixes: !Ref BucketPrefixes
      KmsKeyArns: !Ref KmsKeyArns
      ReaderRoleName: !If [UseRole, !Ref ReaderRole, ""]
      ReaderUserName: !If [UseKey, !Ref ReaderUser, ""]

Outputs:
  SourceTag:
    Value: !Ref SourceTag
  Region:
    Value: !Ref AWS::Region
  QueueUrl:
    Value: !Ref IngestQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  BucketNames:
    Description: Buckets currently wired (as reconciled by the manager)
    Value: !GetAtt BucketWiring.Buckets
  BucketPrefixes:
    Value: !Join [",", !Ref BucketPrefixes]
  ReaderRoleArn:
    Condition: UseRole
    Description: Send this to the ingesting team (not a secret)
    Value: !GetAtt ReaderRole.Arn
  ReaderAccessKeySecretArn:
    Condition: UseKey
    Description: Secrets Manager secret holding the access key. Share its value securely, never by email.
    Value: !Ref ReaderAccessKeySecret
