AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Event-driven log ingestion onboarding. Pick which log types to share; the stack finds
  where this account delivers them, wires those S3 buckets to one SQS queue, and lets
  the ingesting account read exactly those buckets. One stack per account and region.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "1. Which logs to share (found automatically)" }
        Parameters: [IngestCloudTrail, IngestVpcFlowLogs, IngestLoadBalancerLogs, IngestWafLogs, IngestConfigLogs, AdditionalBuckets]
      - Label: { default: "2. Keeping it up to date" }
        Parameters: [AutoRescan]
      - Label: { default: "3. Access (pre-filled by your onboarding link, leave as is)" }
        Parameters: [AccessMode, TrustedPrincipalArn, ExternalId]
    ParameterLabels:
      IngestCloudTrail: { default: "CloudTrail (API activity)" }
      IngestVpcFlowLogs: { default: "VPC Flow Logs (network traffic)" }
      IngestLoadBalancerLogs: { default: "Load balancer access logs" }
      IngestWafLogs: { default: "WAF logs" }
      IngestConfigLogs: { default: "AWS Config (resource changes)" }
      AdditionalBuckets: { default: "Other buckets (optional)" }
      AutoRescan: { default: "Pick up new log sources automatically every day?" }
      AccessMode: { default: "Access mode" }
      TrustedPrincipalArn: { default: "Ingesting account principal" }
      ExternalId: { default: "External ID" }

Parameters:
  IngestCloudTrail:
    Type: String
    Default: "Yes"
    AllowedValues: ["Yes", "No"]
  IngestVpcFlowLogs:
    Type: String
    Default: "Yes"
    AllowedValues: ["Yes", "No"]
  IngestLoadBalancerLogs:
    Type: String
    Default: "Yes"
    AllowedValues: ["Yes", "No"]
  IngestWafLogs:
    Type: String
    Default: "Yes"
    AllowedValues: ["Yes", "No"]
  IngestConfigLogs:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  AdditionalBuckets:
    Type: CommaDelimitedList
    Default: "NONE"
    Description: >-
      Buckets not found automatically, e.g. logs copied in by Firehose. Format
      bucket or bucket:prefix/, comma-separated. NONE for none.
  AutoRescan:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
    Description: >-
      Yes: re-discover once a day and wire new sources without a stack update.
      No: discovery runs only when the stack is created or updated.
  AccessMode:
    Type: String
    Default: CrossAccountRole
    AllowedValues: [CrossAccountRole, AccessKey]
    Description: >-
      CrossAccountRole (recommended, no long-lived secrets) or AccessKey
      (an IAM user whose key is stored in Secrets Manager).
  TrustedPrincipalArn:
    Type: String
    Default: "__TRUSTED_PRINCIPAL__"
    Description: The ingesting account's role or account ARN. Required for CrossAccountRole.
  ExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: Unique to your organization; comes with your onboarding link. Required for CrossAccountRole.

Rules:
  RoleModeNeedsTrust:
    RuleCondition: !Equals [!Ref AccessMode, CrossAccountRole]
    Assertions:
      - Assert: !Not [!Equals [!Ref TrustedPrincipalArn, ""]]
        AssertDescription: TrustedPrincipalArn is required. Use the onboarding link you were sent.
      - Assert: !Not [!Equals [!Ref ExternalId, ""]]
        AssertDescription: ExternalId is required. Use the onboarding link you were sent.

Conditions:
  UseRole: !Equals [!Ref AccessMode, CrossAccountRole]
  UseKey: !Equals [!Ref AccessMode, AccessKey]
  Rescan: !Equals [!Ref AutoRescan, "Yes"]

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "log-ingest-${AWS::AccountId}-${AWS::Region}-dlq"
      MessageRetentionPeriod: 1209600        # 14 days to notice and redrive
      SqsManagedSseEnabled: true

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "log-ingest-${AWS::AccountId}-${AWS::Region}"
      VisibilityTimeout: 300                 # > worst-case time to fetch + parse one object
      MessageRetentionPeriod: 345600         # 4 days of buffer if the consumer is down
      ReceiveMessageWaitTimeSeconds: 20      # long polling: fewer, cheaper API calls
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  IngestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IngestQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3FromThisAccountOnly
            Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              ArnLike: { "aws:SourceArn": "arn:aws:s3:::*" }
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ---------------------------------------------------------------- reader identity
  ReaderRole:
    Type: AWS::IAM::Role
    Condition: UseRole
    Properties:
      RoleName: !Sub "log-ingest-${AWS::AccountId}-${AWS::Region}-reader"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref TrustedPrincipalArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "sts:ExternalId": !Ref ExternalId }
      Policies:
        - PolicyName: consume-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: !GetAtt IngestQueue.Arn

  ReaderUser:
    Type: AWS::IAM::User
    Condition: UseKey
    Properties:
      UserName: !Sub "log-ingest-${AWS::AccountId}-${AWS::Region}-reader"
      Policies:
        - PolicyName: consume-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: !GetAtt IngestQueue.Arn

  ReaderAccessKey:
    Type: AWS::IAM::AccessKey
    Condition: UseKey
    Properties:
      UserName: !Ref ReaderUser

  ReaderAccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseKey
    Properties:
      Name: !Sub "log-ingest/${AWS::Region}/reader-access-key"
      Description: Access key for the log-ingest reader. Share through a secure channel only.
      SecretString: !Sub '{"AccessKeyId":"${ReaderAccessKey}","SecretAccessKey":"${ReaderAccessKey.SecretAccessKey}"}'

  # ---------------------------------------------------------------- bucket manager
  ManagerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: discover-and-wire
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverLogDestinationsReadOnly
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - ec2:DescribeFlowLogs
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - wafv2:ListWebACLs
                  - wafv2:GetLoggingConfiguration
                  - config:DescribeDeliveryChannels
                  - kms:DescribeKey
                Resource: "*"
              - Sid: InspectAndWireBuckets   # buckets are discovered at runtime, so this can't be narrowed statically
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetEncryptionConfiguration, s3:GetBucketNotification, s3:PutBucketNotification]
                Resource: "arn:aws:s3:::*"
              - Sid: EditReaderInlinePolicyOnly
                Effect: Allow
                Action: !If
                  - UseRole
                  - [iam:GetRolePolicy, iam:PutRolePolicy, iam:DeleteRolePolicy]
                  - [iam:GetUserPolicy, iam:PutUserPolicy, iam:DeleteUserPolicy]
                Resource: !If [UseRole, !GetAtt ReaderRole.Arn, !GetAtt ReaderUser.Arn]

  ManagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Discovers log buckets and keeps their notifications and read access in sync
      Runtime: python3.13
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt ManagerRole.Arn
      Environment:
        Variables:
          CONFIG_ID: !Sub "log-ingest-${AWS::AccountId}-${AWS::Region}"
          QUEUE_ARN: !GetAtt IngestQueue.Arn
          ACCOUNT_ID: !Ref AWS::AccountId
          REGION: !Ref AWS::Region
          READER_ROLE: !If [UseRole, !Ref ReaderRole, ""]
          READER_USER: !If [UseKey, !Ref ReaderUser, ""]
          INGEST_CLOUDTRAIL: !Ref IngestCloudTrail
          INGEST_VPCFLOWLOGS: !Ref IngestVpcFlowLogs
          INGEST_LOADBALANCERLOGS: !Ref IngestLoadBalancerLogs
          INGEST_WAFLOGS: !Ref IngestWafLogs
          INGEST_CONFIGLOGS: !Ref IngestConfigLogs
          ADDITIONAL_BUCKETS: !Join [",", !Ref AdditionalBuckets]
      Code:
        ZipFile: |
          __MANAGER_CODE__

  ManagerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ManagerFunction}"
      RetentionInDays: 30

  DailyRescan:
    Type: AWS::Events::Rule
    Condition: Rescan
    Properties:
      Description: Re-discover log sources daily and wire any new ones
      ScheduleExpression: rate(1 day)
      Targets:
        - Id: manager
          Arn: !GetAtt ManagerFunction.Arn

  DailyRescanPermission:
    Type: AWS::Lambda::Permission
    Condition: Rescan
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ManagerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyRescan.Arn

  BucketWiring:
    Type: Custom::BucketWiring
    DependsOn: [IngestQueuePolicy, ManagerLogGroup]   # S3 checks the queue policy when wiring
    Properties:
      ServiceToken: !GetAtt ManagerFunction.Arn
      # Listed so that changing any dropdown re-runs discovery on stack Update.
      IngestCloudTrail: !Ref IngestCloudTrail
      IngestVpcFlowLogs: !Ref IngestVpcFlowLogs
      IngestLoadBalancerLogs: !Ref IngestLoadBalancerLogs
      IngestWafLogs: !Ref IngestWafLogs
      IngestConfigLogs: !Ref IngestConfigLogs
      AdditionalBuckets: !Ref AdditionalBuckets

Outputs:
  AccountId:
    Value: !Ref AWS::AccountId
  Region:
    Value: !Ref AWS::Region
  QueueUrl:
    Value: !Ref IngestQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  WiredBuckets:
    Description: Buckets discovered and wired when the stack was last created or updated
    Value: !GetAtt BucketWiring.WiredBuckets
  SkippedSources:
    Description: Log destinations found but not wired here, with the reason (other account or region)
    Value: !GetAtt BucketWiring.Skipped
  RescanNow:
    Description: Run discovery now without a stack update
    Value: !Sub "aws lambda invoke --function-name ${ManagerFunction} --region ${AWS::Region} rescan.json"
  ReaderRoleArn:
    Condition: UseRole
    Description: Send this to the ingesting team (not a secret)
    Value: !GetAtt ReaderRole.Arn
  ReaderAccessKeySecretArn:
    Condition: UseKey
    Description: Secrets Manager secret holding the access key. Share its value securely, never by email.
    Value: !Ref ReaderAccessKeySecret
